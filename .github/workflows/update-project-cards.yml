name: Update project cards

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - bin/update_project_cards
      - res/projects/projects.json
      - res/projects/*.jpg
      - .github/workflows/update-project-cards.yml

permissions:
  contents: write

concurrency:
  group: project-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 bin/update_project_cards --refresh
      - name: Commit updated cards
        run: |
          git add res/projects/metadata.json res/projects/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update project cards'
          git push
